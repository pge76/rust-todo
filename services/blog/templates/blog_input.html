<form hx-post="/blog" hx-target="body">
  <input 
    id="blog_title" 
    name="blog_title" 
    type="text"
    placeholder="Blog Title"
    aria-label="Blog Title"/>
  <textarea 
    id="blog_text" 
    name="blog_text" 
    placeholder="Type here ..."
    aria-label="Blog Text"
    type="textarea" 
    ></textarea>
  <button type="submit">Submit</button>
</form>
