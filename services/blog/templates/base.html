<!doctype html>
<html lang="en">
<head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >    <!-- Allow any inheriting page to set it's own title -->
    <title>{% block title %}{{ title }}{% endblock %}</title>

    <!-- Allow any inheriting page to extend head with additional assets -->
    {% block head %}{% endblock %}
</head>
 <body>
    <header class="container">{% block header %}{% endblock %}</header>
    <main class="container">{% block main %}{% endblock %}</main>
    <footer>{% block footer%}{% endblock %}</footer>
  </body>
</html>
